name: ci-cd

# Requirement 24: Git Push -> Unit Tests -> Lint -> Terraform Validate -> Build -> Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # for OIDC AWS auth on deploy (no long-lived keys in GitHub)

jobs:
  test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Spark 3.5 compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff + black)
        run: |
          ruff check glue tests lambda
          black --check glue tests lambda

      - name: Unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest tests/ -q

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cdc_lib.zip (referenced by Glue resources)
        run: |
          mkdir -p dist
          cd glue && zip -q -r ../dist/cdc_lib.zip cdc_lib -x '*__pycache__*'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: cd terraform && terraform fmt -check -recursive

      - name: Terraform init (no backend) + validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  build-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: [test, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build artifacts
        run: |
          mkdir -p dist
          cd glue && zip -q -r ../dist/cdc_lib.zip cdc_lib -x '*__pycache__*'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve \
            -var="environment=prod" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}"
